<svg xmlns="http://www.w3.org/2000/svg" width="130" height="38" viewBox="0 0 130 38">
  <defs>
    <linearGradient id="blueLinePort" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff" />
      <stop offset="100%" stop-color="#00b4d8" />
    </linearGradient>
  </defs>
  <style>
    @media (prefers-color-scheme: light) {
      .txt { fill: #1f2328; }
      .bar { fill: #0969da; }
    }
    @media (prefers-color-scheme: dark) {
      .txt { fill: #e6edf3; }
      .bar { fill: url(#blueLinePort); }
    }
  </style>
  <text class="txt" x="65" y="22" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#e6edf3" letter-spacing="0.5px">Portfolio</text>
  <rect class="bar" x="15" y="29" width="100" height="3" rx="1.5" fill="#58a6ff" />
</svg>
